# Local stack in mock mode: app, queue worker, scheduler, MySQL, Prometheus, Grafana.
x-app: &app
  build: .
  image: ojs-editorial-dashboard:dev
  environment: &app-env
    APP_ENV: local
    # Fixed, public key for this local mock stack only; never reuse it anywhere real.
    APP_KEY: base64:b2pzLWRhc2hib2FyZC1sb2NhbC1kZXYta2V5LTAwMDA=
    APP_DEBUG: "true"
    APP_URL: http://localhost:8000
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ojs_dashboard
    DB_USERNAME: ojs
    DB_PASSWORD: ojs
    OJS_DRIVER: mock
    QUEUE_CONNECTION: database
    LOG_CHANNEL: stderr

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ojs_dashboard
      MYSQL_USER: ojs
      MYSQL_PASSWORD: ojs
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    <<: *app
    command: serve
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *app
    command: ["queue:work", "--tries=3"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/editorial.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mysql-data:
