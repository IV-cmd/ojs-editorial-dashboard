[www]
; The master runs as UID 10001 and cannot setuid workers, so the pool must run as
; the same user explicitly.
user = app
group = app
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Laravel is configured purely through environment variables in this image; keep
; them visible to PHP instead of writing a .env file to a read-only filesystem.
clear_env = no
