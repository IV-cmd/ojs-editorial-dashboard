apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ojs-dashboard.fullname" . }}-secrets
  labels:
    {{- include "ojs-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ required "secrets.appKey is required" .Values.secrets.appKey | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  OJS_API_TOKEN: {{ .Values.secrets.ojsApiToken | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.secrets.mysqlRootPassword | quote }}
